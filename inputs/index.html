<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Sources</title>
  <style>
    @font-face { font-family: 'Outfit'; src: url('fonts/outfit.ttf'); }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    /* Darkens only the bottom of the picture, under the panel. */
    #shade {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 560px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.75));
      opacity: 0;
      transition: opacity 220ms ease;
    }

    #panel {
      position: absolute;
      left: 50%;
      bottom: 90px;
      transform: translate(-50%, 40px);
      opacity: 0;
      padding: 34px 40px 40px;
      border-radius: 52px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(180deg, rgba(40, 40, 46, 0.92), rgba(18, 18, 22, 0.94));
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
      transition: opacity 220ms ease, transform 320ms cubic-bezier(0.2, 0.9, 0.3, 1.15);
    }

    body.shown #shade { opacity: 1; }
    body.shown #panel { opacity: 1; transform: translate(-50%, 0); }

    h1 {
      margin: 0 6px 26px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    #cards { display: flex; gap: 28px; }

    .card {
      position: relative;
      width: 260px;
      height: 200px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 360ms cubic-bezier(0.2, 0.9, 0.3, 1.25), background 200ms ease;
      will-change: transform;
    }

    .card svg { width: 72px; height: 72px; fill: currentColor; opacity: 0.9; }
    .card .label { margin-top: 18px; font-size: 30px; font-weight: 500; }
    .card .sub { margin-top: 4px; font-size: 20px; color: rgba(255, 255, 255, 0.55); }

    /* The input on screen now. */
    .card .now {
      position: absolute;
      top: 16px; right: 18px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #34c759;
      display: none;
    }
    .card.current .now { display: block; }

    /* Focus, as on the launcher: the card lifts. */
    .card.focused {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      transform: translateY(-8px) scale(1.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55);
    }
    .card.focused .sub { color: rgba(0, 0, 0, 0.5); }

    #empty { font-size: 28px; color: rgba(255, 255, 255, 0.7); padding: 30px 60px; }
  </style>
</head>
<body>
  <div id="shade"></div>
  <div id="panel">
    <h1>Sources</h1>
    <div id="cards"></div>
  </div>
  <script src="inputs.js"></script>
</body>
</html>
